# Configuración de Mosquitto para los guantes.
#
# 🔴 POR QUE ESTE ARCHIVO EXISTE
#
# Mosquitto 2.x, con su configuración por defecto, escucha SOLO en localhost
# (127.0.0.1 y ::1). Comprobado en esta PC el 16 de octubre de 2026 con
# `Get-NetTCPConnection -LocalPort 1883`. Eso significa que:
#
#   * La app en la misma PC conecta sin problema.
#   * Los ESP32, desde el WiFi, NO conectan. Nunca. Sin un mensaje de error
#     útil: simplemente no llegan.
#
# Es el cambio que rompió Mosquitto 2.0 respecto a la 1.x, y es exactamente el
# tipo de fallo que aparece el día de la demo y no antes, porque en desarrollo
# todo corre en la misma máquina.
#
# Y hay una segunda trampa encadenada: en cuanto se declara un `listener`,
# `allow_anonymous` pasa a valer **false** por defecto. Así que declarar solo el
# listener cambia "no conecta nadie de fuera" por "conectan y el broker los
# rechaza".
#
# COMO APLICARLO (hace falta terminal como administrador):
#
#   copy "mosquitto\mosquitto-guantes.conf" "C:\Program Files\mosquitto\mosquitto.conf"
#   Restart-Service mosquitto
#
# Y comprobar que ahora sí escucha en todas las interfaces:
#
#   Get-NetTCPConnection -LocalPort 1883 -State Listen
#
# Tiene que aparecer 0.0.0.0, no solo 127.0.0.1.
#
# 🔴 USAR `copy`, NO `Set-Content -Encoding utf8`. PowerShell 5.1 le mete un BOM
# al principio del archivo, y **mosquitto no arranca y no dice por qué**: el
# servicio simplemente no queda escuchando. Pasó mientras se probaba esto.
#
# ✅ EL FIREWALL YA ESTA RESUELTO. El instalador de winget crea dos reglas de
# entrada llamadas "mosquitto", por programa, así que cubren cualquier puerto.
# Comprobado: con esta configuración, una conexión TCP desde la IP de red
# (192.168.0.13) al broker ABRE. No hay que tocar el firewall.
#
# ✅ PROBADO DE PUNTA A PUNTA el 16 de octubre de 2026 con esta configuración,
# en el puerto 1884 para no tocar el servicio: los dos guantes publicando a la
# IP de red y la app escuchando ahí mismo, **50,0 Hz, 0 % de pérdida, 1 ms de
# latencia**, y el `estado online` llegando por retain.
#
# 📌 LA IP QUE VA EN EL FIRMWARE es la de esta PC en la red, no "localhost":
#
#   (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike "127.*" }).IPAddress
#
# Y cambia al cambiar de red. En la red del aula será otra, y con el hotspot del
# celular otra distinta. Por eso la IP del broker es un campo de la pantalla de
# configuración y no una constante en el código.

# --- El listener de los guantes ---------------------------------------------
# 0.0.0.0 = todas las interfaces de red, que es lo que hace falta para que los
# ESP32 lleguen desde el WiFi.
listener 1883 0.0.0.0

# Sin usuario ni contraseña. Es un broker de laboratorio en una red local y los
# ESP32 no manejan credenciales en este proyecto.
# 🔴 Si algún día esto sale a internet, esta línea es un agujero: habría que
# poner `allow_anonymous false` y un `password_file`.
allow_anonymous true

# --- Aguante -----------------------------------------------------------------
# Dos guantes a 50 Hz son 100 mensajes por segundo. El valor por defecto de
# mensajes en vuelo es 20, de sobra para QoS 0, pero se sube por si se mete
# algún publicador en QoS 1.
max_inflight_messages 100

# No persistir nada: los datos de los guantes son de tiempo real y un dato de
# hace cinco minutos no sirve. Además evita que el archivo de persistencia
# crezca durante las sesiones de grabación.
persistence false

# --- Registro ----------------------------------------------------------------
# Útil durante las pruebas de red: aquí se ve si un ESP32 conectó, con qué
# client_id, y si lo expulsaron por id duplicado.
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
